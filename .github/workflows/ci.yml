name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next 16 generates global page/layout types; tsc fails on a clean checkout without it.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx vitest run
